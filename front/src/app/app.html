<h1>Мои задачи</h1>

<button
    type="button"
    (click)="loadTasks()">
    Загрузить задачи
</button>

@if (taskListError()) {
    <p>{{ taskListError() }}</p>
}

<ul>
    @for (task of tasks(); track task.id) {
        <li>{{ task.title }}</li>
    }
</ul>

<label>
    Название задачи:
    <input
        type="text"
        #titleInput
        (input)="draftTitle.set(titleInput.value)"
    >
</label>

<label>
    Описание задачи:
    <textarea
        #descriptionInput
        (input)="draftDescription.set(descriptionInput.value)"
    ></textarea>
</label>

<button
    type="button"
    [disabled]="isCreatingTask()"
    (click)="createTask(draftTitle(), draftDescription())">
    {{ isCreatingTask() ? 'Задача создается' : 'Создать задачу' }}
</button>

@if (statusMessage()) {
    <p>{{ statusMessage() }}</p>
}
