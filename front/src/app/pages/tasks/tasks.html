<h1>Список задач</h1>

<section id="task-list">
    <button
        type="button"
        class="task-button primary-button"
        (click)="loadTasks()">
        Загрузить задачи
    </button>

    @if (taskListError()) {
        <p>{{ taskListError() }}</p>
    }

    <ul>
        @for (task of tasks(); track task.id) {
            <li>{{ task.title }}</li>
        }
    </ul>
</section>
